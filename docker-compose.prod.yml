services:
  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      AUTH_BASE_URL: http://supabase-auth:9999
      AUTH_JWKS_URL: http://supabase-auth:9999/auth/v1/.well-known/jwks.json
      AUTH_JWT_ISSUER: https://api.crispytv.tech
    command: npm run start:api
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:18765:18765"
    networks:
      - default
      - supabase_default

  worker:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      AUTH_BASE_URL: http://supabase-auth:9999
      AUTH_JWKS_URL: http://supabase-auth:9999/auth/v1/.well-known/jwks.json
      AUTH_JWT_ISSUER: https://api.crispytv.tech
    command: npm run start:worker
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - supabase_default

volumes:
  redis-data:

networks:
  supabase_default:
    external: true
    name: supabase_default
