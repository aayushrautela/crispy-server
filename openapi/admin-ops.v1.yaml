  /admin/api/accounts/{accountId}/profiles/{profileId}/recommendations/recompute:
    post:
      tags:
        - Admin Accounts
      operationId: postAdminApiAccountsAccountIdProfilesProfileIdRecommendationsRecompute
      summary: Enqueue recommendation recompute for one profile
      description: |
        Enqueues one `recommendation.recompute_requested` event in `service_outbox_events`
        with reason `admin_requested`. The endpoint confirms the profile belongs to the
        account and returns dispatch-tracking metadata only; it does not wait for
        downstream recommendation generation to finish and does not return a generation
        job id or progress.

        This is an admin mutation and follows the existing admin route conventions:
        callers need an authenticated admin session or authorized admin bearer token,
        plus the admin mutation/CSRF protection required by the deployed admin stack.
      security:
        - AdminSession: []
        - AdminBearer: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - $ref: "#/components/parameters/AdminMutationCsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRecommendationRecomputeRequest"
      responses:
        "202":
          description: Recompute request event accepted for asynchronous dispatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRecommendationRecomputeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /admin/api/accounts/{accountId}/recommendations/recompute:
    post:
      tags:
        - Admin Accounts
      operationId: postAdminApiAccountsAccountIdRecommendationsRecompute
      summary: Enqueue recommendation recompute for selected account profiles
      description: |
        Enqueues one `recommendation.recompute_requested` event per selected profile in
        `service_outbox_events` with reason `admin_requested`. The current MVP accepts
        selected profiles only and caps one request at 50 profile ids. It returns
        outbox/dispatch-tracking metadata only, not downstream generation completion.

        This is an admin mutation and follows the existing admin route conventions:
        callers need an authenticated admin session or authorized admin bearer token,
        plus the admin mutation/CSRF protection required by the deployed admin stack.
      security:
        - AdminSession: []
        - AdminBearer: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - $ref: "#/components/parameters/AdminMutationCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAccountRecommendationRecomputeRequest"
      responses:
        "202":
          description: Recompute request events accepted for asynchronous dispatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountRecommendationRecomputeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
