  /admin/api/accounts/{accountId}/profiles/{profileId}/notify-recompute:
    post:
      tags:
        - Admin Accounts
      operationId: postAdminApiAccountsAccountIdProfilesProfileIdNotifyRecompute
      summary: Notify the recommender engine that a profile needs a recompute
      description: |
        Fires a fire-and-forget `recommendation.recompute_requested` notification
        to the external recommender engine for one profile. The endpoint confirms
        the profile belongs to the account, then dispatches the notification
        with reason `admin_requested`. There is no outbox, no durable job id,
        no retry tracking, and no diagnostics follow-up — the notification is
        lost on network failure and re-sent on the next change. RECO is
        idempotent on `profileId` and converges to the right state.

        This is an admin mutation and follows the existing admin route conventions:
        callers need an authenticated admin session or authorized admin bearer token,
        plus the admin mutation/CSRF protection required by the deployed admin stack.
      security:
        - AdminSession: []
        - AdminBearer: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - $ref: "#/components/parameters/AdminMutationCsrfToken"
      responses:
        "202":
          description: Notification accepted (the POST is dispatched out-of-band).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNotifyRecomputeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /admin/api/accounts/{accountId}/recommendations/notify-recompute:
    post:
      tags:
        - Admin Accounts
      operationId: postAdminApiAccountsAccountIdRecommendationsNotifyRecompute
      summary: Notify the recommender engine for the selected profiles of an account
      description: |
        Fires one fire-and-forget `recommendation.recompute_requested`
        notification per selected profile in the account, with reason
        `admin_requested`. The endpoint validates account membership, caps one
        request at 50 profile ids, and does not persist any state. Lost
        notifications are recovered by the next change event for that profile.

        This is an admin mutation and follows the existing admin route conventions.
      security:
        - AdminSession: []
        - AdminBearer: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - $ref: "#/components/parameters/AdminMutationCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAccountNotifyRecomputeRequest"
      responses:
        "202":
          description: Notifications accepted for asynchronous dispatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountNotifyRecomputeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
