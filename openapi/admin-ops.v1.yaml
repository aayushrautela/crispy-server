          $ref: "#/components/responses/ServerError"
  /admin/api/accounts/{accountId}/profiles/{profileId}/recompute:
    post:
      tags:
        - Admin Homescreen
      operationId: postAdminApiAccountsAccountIdProfilesProfileIdRecompute
      summary: Enqueue a profile recompute
      security:
        - AdminSession: []
        - AdminBearer: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/AdminMutationCsrfToken"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"


components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: crispy_admin_session
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: service-token
  parameters:
    AdminMutationCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Admin mutation/CSRF token required by existing admin session route conventions when using cookie-based admin auth.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 256
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Authenticated actor is not authorized.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Write conflict or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    RecommendationRecomputeReason:
      type: string
      description: Current runtime recompute reason values. `admin_requested` is used for admin-triggered recompute requests.
      enum:
        - watch_history_changed
        - rating_changed
        - watchlist_changed
        - playback_progress_changed
        - profile_created
        - profile_settings_changed
        - admin_requested
    AdminNotifyRecomputeResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - accountId
        - profileId
      properties:
        ok:
          type: boolean
        accountId:
          type: string
        profileId:
          type: string
    AdminAccountNotifyRecomputeRequest:
      type: object
      additionalProperties: false
      required:
        - profileIds
      properties:
        profileIds:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 512
          description: Selected profile ids under the account. Tier-wide or unbounded notify is outside the MVP.
    AdminAccountNotifyRecomputeResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - accountId
        - profileIds
        - enqueued
        - skipped
      properties:
        ok:
          type: boolean
        accountId:
          type: string
        profileIds:
          type: array
          items:
            type: string
        enqueued:
          type: integer
          minimum: 0
          maximum: 50
        skipped:
          type: integer
          minimum: 0
          maximum: 50
    ErrorEnvelope:
      type: object
      additionalProperties: true
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: true
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
    GenericObject:
      type: object
      additionalProperties: true
    GenericArray:
      type: array
      items:
        $ref: "#/components/schemas/GenericObject"
