openapi: 3.1.0
info:
  title: Crispy Internal Recommender API
  version: 1.0.0
  summary: Provider-owned contract for the internal recommendation-engine integration surface.
  description: |
    Crispy Server is the source of truth for these internal APIs. The external
    recommendation engine consumes this contract and must not rely on legacy
    fallback shapes or consumer-owned schemas.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
x-api-class: internal-service
x-owner: crispy-server
x-stability: stable
servers:
  - url: https://api.crispy.example
    description: Production API origin placeholder
security:
  - RecommenderServiceBearer: []
tags:
  - name: App Identity
    description: Service principal self-inspection and configuration.
  - name: Profile Eligibility
    description: Profile eligibility discovery and change tracking.
  - name: Signal Bundles
    description: Profile signal data for recommendation generation.
  - name: Recommendation Lists
    description: Service-owned recommendation result publication.
  - name: Recommendation Runs
    description: Recommendation generation run lifecycle management.
  - name: Audit Events
    description: Service audit event logging.
  - name: AI Plan
    description: Server-owned AI-plan generation boundary.
  - name: Recommender Event Ingestion
    description: RECO-owned event ingestion endpoint called by MAIN outbox dispatcher.
paths:
  /internal/recommender/v1/events:
    post:
      tags: [Recommender Event Ingestion]
      operationId: ingestRecommenderEvent
      summary: Ingest a MAIN service-outbox event
      description: |
        RECO-owned inbound endpoint called by MAIN's service-outbox dispatcher.
        MAIN dispatches `service_outbox_events` rows here, including
        `recommendation.recompute_requested` envelopes with reason `admin_requested`
        for admin-triggered recompute requests.

        A duplicate event response (`409 Conflict`) is treated by MAIN's dispatcher as
        idempotent success and the service-outbox row may be marked dispatched. `2xx`
        responses are success. `400`, `401`, and `403` are permanent dispatch failures.
        `5xx` and network/timeout failures are retried by MAIN according to outbox
        retry policy.

        The current MVP response acknowledges the event and may return a recommender
        event id only. It does not return a generation job id, generation status, or
        progress to MAIN.
      x-internal: true
      x-owner: crispy-recommendation-engine
      x-consumers: [crispy-server-main]
      parameters:
        - $ref: '#/components/parameters/RecommenderInboundAuthorization'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommenderEventEnvelope' }
      responses:
        '202':
          description: Event accepted for recommender-side processing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommenderEventAcceptedResponse' }
        '200':
          description: Event accepted or already processed idempotently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommenderEventAcceptedResponse' }
        '400':
          description: Invalid event envelope; permanent failure for MAIN dispatcher.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalErrorEnvelope' }
        '401':
          description: Missing or invalid bearer token; permanent failure until configuration is fixed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalErrorEnvelope' }
        '403':
          description: Authenticated caller is not allowed to ingest events; permanent failure until configuration is fixed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalErrorEnvelope' }
        '409':
          description: Duplicate event receipt. MAIN treats this as idempotent success for dispatch state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommenderEventAcceptedResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/me:
    get:
      tags: [App Identity]
      operationId: getInternalAppSelf
      summary: Return the authenticated service app principal
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Authenticated service app details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppSelfResponse' }
              examples:
                success:
                  externalValue: ./examples/auth-me/response.success.json
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/profiles/eligible/changes:
    get:
      tags: [Profile Eligibility]
      operationId: listInternalEligibleProfileChanges
      summary: List eligible profile changes using canonical cursor pagination
      description: Uses provider-owned query names only; no legacy since alias is accepted by this contract.
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 4096 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: reason
          in: query
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: accountId
          in: query
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: profileId
          in: query
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: A page of eligible profile changes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EligibleProfileChangesResponse' }
              examples:
                page:
                  externalValue: ./examples/eligible-changes/response.page.json
                empty:
                  externalValue: ./examples/eligible-changes/response.empty.json
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '429': { $ref: '#/components/responses/RateLimitedError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/profiles/eligible/snapshots:
    post:
      tags: [Profile Eligibility]
      operationId: createInternalEligibleProfileSnapshot
      summary: Create an eligible profile snapshot
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EligibleProfileSnapshotCreateRequest' }
            examples:
              valid:
                externalValue: ./examples/eligible-snapshots/request.valid.json
      responses:
        '201':
          description: Snapshot created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EligibleProfileSnapshotResponse' }
              examples:
                created:
                  externalValue: ./examples/eligible-snapshots/response.created.json
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '429': { $ref: '#/components/responses/RateLimitedError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/profiles/eligible/snapshots/{snapshotId}/items:
    get:
      tags: [Profile Eligibility]
      operationId: listInternalEligibleProfileSnapshotItems
      summary: List eligible profile snapshot items with nested cursor
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 4096 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: leaseSeconds
          in: query
          description: Optional lease duration for returned snapshot items.
          schema: { type: integer, minimum: 1, maximum: 3600 }
      responses:
        '200':
          description: A page of snapshot items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EligibleProfileSnapshotItemsResponse' }
              examples:
                page:
                  externalValue: ./examples/eligible-snapshots/items.response.page.json
                empty:
                  externalValue: ./examples/eligible-snapshots/items.response.empty.json
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '429': { $ref: '#/components/responses/RateLimitedError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/accounts/{accountId}/profiles/{profileId}/eligibility:
    get:
      tags: [Profile Eligibility]
      operationId: getInternalProfileEligibility
      summary: Return current recommendation eligibility for a profile
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Eligibility decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileEligibilityResponse' }
              examples:
                eligible:
                  externalValue: ./examples/profile-eligibility/response.eligible.json
                ineligible:
                  externalValue: ./examples/profile-eligibility/response.ineligible.json
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/accounts/{accountId}/profiles/{profileId}/signals/recommendation-bundle:
    get:
      tags: [Signal Bundles]
      operationId: getInternalRecommendationSignalBundle
      summary: Return recommendation signal bundle for a profile
      description: 'Uses canonical provider limit query names: historyLimit, ratingsLimit, watchlistLimit, continueLimit.'
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: historyLimit
          in: query
          schema: { type: integer, minimum: 0, maximum: 500 }
        - name: ratingsLimit
          in: query
          schema: { type: integer, minimum: 0, maximum: 500 }
        - name: watchlistLimit
          in: query
          schema: { type: integer, minimum: 0, maximum: 500 }
        - name: continueLimit
          in: query
          schema: { type: integer, minimum: 0, maximum: 500 }
        - name: include
          in: query
          description: Comma-separated signal families to include.
          schema: { type: string, example: history,ratings,watchlist,continue }
        - name: since
          in: query
          description: Optional lower bound for incremental signal reads.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Recommendation signals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationSignalBundleResponse' }
              examples:
                full:
                  externalValue: ./examples/signal-bundle/response.full.json
                minimal:
                  externalValue: ./examples/signal-bundle/response.minimal.json
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '429': { $ref: '#/components/responses/RateLimitedError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/recommendations/service-lists:
    get:
      tags: [Recommendation Lists]
      operationId: listInternalRecommendationServiceLists
      summary: List service-owned recommendation list descriptors
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Configured writable service lists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationServiceListsResponse' }
              examples:
                success:
                  externalValue: ./examples/service-lists/response.success.json
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/accounts/{accountId}/profiles/{profileId}/recommendations/lists/{listKey}:
    put:
      tags: [Recommendation Lists]
      operationId: upsertInternalRecommendationList
      summary: Upsert a service-owned recommendation list
      description: |
        Publishes an ordered recommendation list for a profile. The caller sends
        only TMDB media references. Crispy Server derives content IDs, canonical
        media keys, rank, source, write mode, policy metadata, and timestamps.
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/ListKey'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationListUpsertRequest'
            examples:
              valid:
                externalValue: ./examples/recommendation-list-upsert/request.valid.json
      responses:
        '201':
          description: A new recommendation-list version was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationListUpsertResponse'
        '200':
          description: An idempotent replay returned the previously written result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationListUpsertResponse'
        '400':
          description: Invalid write DTO, including server-derived fields such as items[].contentId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalErrorEnvelope'
              examples:
                unsupportedField:
                  externalValue: ./examples/recommendation-list-upsert/error.unsupported-field.json
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitedError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/recommendations/batch-upsert:
    post:
      tags: [Recommendation Lists]
      operationId: batchUpsertInternalRecommendations
      summary: Batch upsert recommendation lists for multiple profiles
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationBatchUpsertRequest' }
            examples:
              valid:
                externalValue: ./examples/batch-upsert/request.valid.json
      responses:
        '200':
          description: Batch upsert completed or partially failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationBatchUpsertResponse' }
              examples:
                success:
                  externalValue: ./examples/batch-upsert/response.success.json
                partialFailure:
                  externalValue: ./examples/batch-upsert/response.partial-failure.json
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitedError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/recommendations/runs:
    post:
      tags: [Recommendation Runs]
      operationId: createInternalRecommendationRun
      summary: Create a recommendation generation run
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationRunCreateRequest' }
            examples:
              valid:
                externalValue: ./examples/recommendation-runs/create.request.json
      responses:
        '201':
          description: Run created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationRunResponse' }
              examples:
                created:
                  externalValue: ./examples/recommendation-runs/create.response.json
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '429': { $ref: '#/components/responses/RateLimitedError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/recommendations/runs/{runId}:
    patch:
      tags: [Recommendation Runs]
      operationId: updateInternalRecommendationRun
      summary: Update a recommendation generation run
      description: Returns 200 with a run envelope; consumers may ignore the body.
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationRunPatchRequest' }
            examples:
              running:
                externalValue: ./examples/recommendation-runs/patch.request.running.json
              completed:
                externalValue: ./examples/recommendation-runs/patch.request.completed.json
      responses:
        '200':
          description: Run updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationRunResponse' }
              examples:
                updated:
                  externalValue: ./examples/recommendation-runs/update.response.json
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/recommendations/runs/{runId}/batches:
    post:
      tags: [Recommendation Runs]
      operationId: createInternalRecommendationRunBatch
      summary: Create or lease a run batch
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationRunBatchCreateRequest' }
            examples:
              valid:
                externalValue: ./examples/recommendation-batches/create.request.json
      responses:
        '201':
          description: Batch created or leased.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationRunBatchResponse' }
              examples:
                created:
                  externalValue: ./examples/recommendation-batches/create.response.json
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/recommendations/runs/{runId}/batches/{batchId}:
    patch:
      tags: [Recommendation Runs]
      operationId: updateInternalRecommendationRunBatch
      summary: Update a run batch
      description: Returns 200 with a batch envelope; consumers may ignore the body.
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationRunBatchPatchRequest' }
            examples:
              completed:
                externalValue: ./examples/recommendation-batches/patch.request.completed.json
              failed:
                externalValue: ./examples/recommendation-batches/patch.request.failed.json
      responses:
        '200':
          description: Batch updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationRunBatchResponse' }
              examples:
                updated:
                  externalValue: ./examples/recommendation-batches/update.response.json
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/audit/events:
    post:
      tags: [Audit Events]
      operationId: writeInternalAuditEvent
      summary: Write a service audit event
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppAuditEventWriteRequest' }
            examples:
              success:
                externalValue: ./examples/audit-events/write.request.success.json
      responses:
        '201':
          description: Audit event written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppAuditEventWriteResponse' }
              examples:
                created:
                  externalValue: ./examples/audit-events/write.response.created.json
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    get:
      tags: [Audit Events]
      operationId: listInternalAuditEvents
      summary: List service audit events
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 4096 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: accountId
          in: query
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: profileId
          in: query
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: runId
          in: query
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: batchId
          in: query
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: A page of audit events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppAuditEventsResponse' }
              examples:
                page:
                  externalValue: ./examples/audit-events/read.response.page.json
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/recommendations/backfills/assignments:
    get:
      tags: [Recommendation Runs]
      operationId: listInternalBackfillAssignments
      summary: List backfill assignments
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: status
          in: query
          schema: { type: string, enum: [pending, leased, completed, failed] }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 4096 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: Backfill assignment page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackfillAssignmentsResponse' }
              examples:
                page:
                  externalValue: ./examples/backfills/assignments.response.page.json
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/accounts/lookup-by-email/{email}/profiles:
    get:
      tags: [Profile Eligibility]
      operationId: lookupInternalAccountProfile
      summary: Lookup account/profile identifiers
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: email
          in: path
          required: true
          schema: { type: string, format: email, minLength: 3, maxLength: 320 }
          example: user@example.com
      responses:
        '200':
          description: Account/profile lookup result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountLookupResponse' }
              examples:
                success:
                  externalValue: ./examples/account-lookup/response.success.json
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/recommendations/v1/accounts/{accountId}/profiles/{profileId}/ai-plan:
    post:
      tags: [AI Plan]
      operationId: generateInternalRecommendationAiPlan
      summary: Generate a bounded AI-assisted recommendation plan
      description: |
        Accepts business inputs and a bounded candidate pool. Crispy Server owns
        AI provider/model selection, credentials, prompts, vendor protocol,
        parsing, validation, and safe error mapping. Request and response bodies
        never include provider secrets, provider IDs, model names, prompt text,
        raw vendor payloads, proxy URLs, or transport overrides.
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationAiPlanRequest'
            examples:
              valid:
                externalValue: ./examples/ai-plan/request.valid.json
      responses:
        '200':
          description: AI-plan generation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationAiPlanResponse'
              examples:
                success:
                  externalValue: ./examples/ai-plan/response.success.json
        '400':
          description: Invalid AI-plan request or unsupported schema version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalErrorEnvelope'
        '422':
          description: Empty or semantically invalid candidate pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalErrorEnvelope'
        '429': { $ref: '#/components/responses/AiPlanRateLimitedError' }
        '500':
          description: Internal AI-plan failure mapped to canonical provider code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalErrorEnvelope'
              examples:
                internalError:
                  externalValue: ./examples/ai-plan/error.internal-error.json
        '502':
          description: AI provider output was invalid or failed provider-side output validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalErrorEnvelope'
              examples:
                invalidVendorOutput:
                  externalValue: ./examples/ai-plan/error.invalid-vendor-output.json
                outputValidationFailed:
                  externalValue: ./examples/ai-plan/error.output-validation-failed.json
        '503':
          description: AI provider unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalErrorEnvelope'
              examples:
                providerUnavailable:
                  externalValue: ./examples/ai-plan/error.provider-unavailable.json
        '504':
          description: AI-plan provider or server deadline exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalErrorEnvelope'
              examples:
                timeout:
                  externalValue: ./examples/ai-plan/error.timeout.json
components:
  securitySchemes:
    RecommenderServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: service-token
      description: Raw service token whose SHA-256 hash matches CRISPY_RECOMMENDER_API_TOKEN_HASH.
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
      example: acct_example_reco_001
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
      example: prof_example_reco_001
    ListKey:
      name: listKey
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[a-z0-9][a-z0-9_-]*$' }
      example: because_you_watched
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
      example: snap_01HXRECO001
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
      example: run_01HXRECO001
    BatchId:
      name: batchId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
      example: batch_01HXRECO001
    Authorization:
      name: Authorization
      in: header
      required: true
      schema: { type: string, pattern: '^Bearer .+$' }
      example: Bearer <service-token>
    RecommenderInboundAuthorization:
      name: Authorization
      in: header
      required: true
      description: Bearer token from MAIN service-outbox dispatcher. RECO validates by comparing SHA-256 hash against MAIN_TO_RECOMMENDER_SERVICE_TOKEN_HASH.
      schema: { type: string, pattern: '^Bearer .+$' }
      example: Bearer <main-service-token>
    ServiceId:
      name: x-service-id
      in: header
      required: true
      schema: { type: string, const: crispy-recommendation-engine }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[\x20-\x7E]+$' }
      example: reco-run-example-001:because-you-watched
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
      example: req_example_01HXRECO
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
      example: corr_example_generation_001
  responses:
    ValidationError:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CanonicalErrorEnvelope' }
    UnauthorizedError:
      description: Missing or invalid service authentication.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CanonicalErrorEnvelope' }
    ForbiddenError:
      description: Service principal is not authorized for the target resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CanonicalErrorEnvelope' }
    NotFoundError:
      description: Resource was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CanonicalErrorEnvelope' }
    ConflictError:
      description: Idempotency or write conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CanonicalErrorEnvelope' }
    RateLimitedError:
      description: Request was rate limited.
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CanonicalErrorEnvelope' }
    AiPlanRateLimitedError:
      description: AI-plan generation was rate limited.
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CanonicalErrorEnvelope' }
    InternalServerError:
      description: Unexpected provider failure.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CanonicalErrorEnvelope' }
  schemas:
    RecommenderEventType:
      type: string
      enum:
        - recommendation.recompute_requested
    RecommenderEventReason:
      type: string
      description: Current runtime recompute reasons. `admin_requested` is emitted by admin recompute endpoints.
      enum:
        - watch_history_changed
        - rating_changed
        - watchlist_changed
        - playback_progress_changed
        - profile_created
        - profile_settings_changed
        - admin_requested
    RecommenderEventEnvelope:
      type: object
      additionalProperties: true
      required: [eventId, eventType, occurredAt, aggregateType, aggregateId, userId, profileId, source, correlationId, payload]
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 128
        eventType:
          $ref: '#/components/schemas/RecommenderEventType'
        eventVersion:
          type: integer
          minimum: 1
          default: 1
        occurredAt:
          type: string
          format: date-time
        aggregateType:
          type: string
          minLength: 1
          maxLength: 128
          example: profile
        aggregateId:
          type: string
          minLength: 1
          maxLength: 128
        userId:
          type: string
          minLength: 1
          maxLength: 128
        profileId:
          type: string
          minLength: 1
          maxLength: 128
        source:
          type: string
          minLength: 1
          maxLength: 128
          example: crispy-server
        correlationId:
          type: string
          minLength: 1
          maxLength: 128
        payload:
          type: object
          additionalProperties: true
          required: [accountId, profileId, reason]
          properties:
            accountId: { type: string, minLength: 1, maxLength: 128 }
            profileId: { type: string, minLength: 1, maxLength: 128 }
            reason: { $ref: '#/components/schemas/RecommenderEventReason' }
    RecommenderEventAcceptedResponse:
      type: object
      additionalProperties: true
      required: [accepted]
      properties:
        accepted:
          type: boolean
          const: true
        recommenderEventId:
          type: string
          description: RECO-side event receipt id when available. This is not a generation job id.
        duplicate:
          type: boolean
          description: True when the event was already received and the response is idempotent.
    ErrorCategory:
      type: string
      enum: [validation, authentication, authorization, not_found, conflict, idempotency, rate_limit, timeout, upstream_dependency, internal]
    ErrorCode:
      type: string
      enum:
        - AUTHENTICATION_REQUIRED
        - INVALID_SERVICE_TOKEN
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - VALIDATION_FAILED
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_CONFLICT
        - RATE_LIMITED
        - REQUEST_TIMEOUT
        - INTERNAL_SERVER_ERROR
        - UNSUPPORTED_RECOMMENDATION_WRITE_FIELD
        - INVALID_RECOMMENDATION_LIST_KEY
        - INVALID_RECOMMENDATION_ITEM
        - DUPLICATE_RECOMMENDATION_ITEM
        - RECOMMENDATION_LIST_TOO_LARGE
        - RECOMMENDATION_PROFILE_NOT_ELIGIBLE
        - INVALID_AI_PLAN_REQUEST
        - UNSUPPORTED_AI_PLAN_SCHEMA_VERSION
        - EMPTY_CANDIDATE_POOL
        - AI_PLAN_TIMEOUT
        - AI_PLAN_RATE_LIMITED
        - AI_PLAN_PROVIDER_UNAVAILABLE
        - AI_PLAN_INVALID_VENDOR_OUTPUT
        - AI_PLAN_OUTPUT_VALIDATION_FAILED
        - AI_PLAN_INTERNAL_ERROR
    ErrorDetails:
      type: object
      description: Safe structured details. Must not contain an authoritative nested code, raw prompt, vendor payload, provider routing, or secrets.
      propertyNames:
        not:
          const: code
      additionalProperties: true
    CanonicalErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, category, retryable, requestId]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, minLength: 1, maxLength: 500 }
            category: { $ref: '#/components/schemas/ErrorCategory' }
            retryable: { type: boolean }
            requestId: { type: string, minLength: 1, maxLength: 128 }
            details: { $ref: '#/components/schemas/ErrorDetails' }
    CursorPage:
      type: object
      additionalProperties: false
      required: [next, hasMore]
      properties:
        next: { type: [string, 'null'] }
        hasMore: { type: boolean }
    Metadata:
      type: object
      additionalProperties: true
    AppSelfResponse:
      type: object
      additionalProperties: false
      required: [appId, name, status, principalType, scopes, ownedSources, ownedListKeys, rateLimitPolicy]
      properties:
        appId: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string }
        principalType: { type: string }
        scopes: { type: array, items: { type: string } }
        ownedSources: { type: array, items: { type: string } }
        ownedListKeys: { type: array, items: { type: string } }
        rateLimitPolicy:
          type: object
          additionalProperties: false
          required: [profileChangesReadsPerMinute, profileSignalReadsPerMinute, recommendationWritesPerMinute, batchWritesPerMinute, configBundleReadsPerMinute, runsPerHour, snapshotsPerDay, maxProfilesPerBatch, maxItemsPerList]
          properties:
            profileChangesReadsPerMinute: { type: number }
            profileSignalReadsPerMinute: { type: number }
            recommendationWritesPerMinute: { type: number }
            batchWritesPerMinute: { type: number }
            configBundleReadsPerMinute: { type: number }
            runsPerHour: { type: number }
            snapshotsPerDay: { type: number }
            maxProfilesPerBatch: { type: number }
            maxItemsPerList: { type: number }
    EligibleProfileChange:
      type: object
      additionalProperties: true
      required: [changeId, accountId, profileId, eventType, eligible, changedAt]
      properties:
        changeId: { type: string }
        accountId: { type: string }
        profileId: { type: string }
        eventType: { type: string }
        eligible: { type: boolean }
        eligibilityVersion: { type: integer, minimum: 0 }
        signalsVersion: { type: integer, minimum: 0 }
        changedAt: { type: string, format: date-time }
        reasons: { type: array, items: { type: string } }
        recommendedActions: { type: array, items: { type: string } }
    EligibleProfileChangesResponse:
      type: object
      additionalProperties: false
      required: [items, cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/EligibleProfileChange' } }
        cursor: { $ref: '#/components/schemas/CursorPage' }
    EligibleProfileSnapshotCreateRequest:
      type: object
      additionalProperties: true
      required: [purpose]
      properties:
        purpose: { type: string, minLength: 1 }
        filters: { $ref: '#/components/schemas/Metadata' }
        reason:
          type: string
          deprecated: true
          description: Legacy alias; callers should send purpose.
        expiresInSeconds: { type: integer, minimum: 1 }
    EligibleProfileSnapshot:
      type: object
      additionalProperties: true
      required: [snapshotId, appId, purpose, status, filters, estimatedProfileCount, createdAt]
      properties:
        snapshotId: { type: string }
        appId: { type: string }
        purpose: { type: string }
        status: { type: string }
        filters: { $ref: '#/components/schemas/Metadata' }
        estimatedProfileCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        approvedBy: { type: [string, 'null'] }
        approvedAt: { type: [string, 'null'], format: date-time }
    EligibleProfileSnapshotResponse:
      type: object
      additionalProperties: false
      required: [snapshot]
      properties:
        snapshot: { $ref: '#/components/schemas/EligibleProfileSnapshot' }
    EligibleProfileSnapshotItem:
      type: object
      additionalProperties: true
      required: [accountId, profileId]
      properties:
        snapshotItemId: { type: string }
        snapshotId: { type: string }
        accountId: { type: string }
        profileId: { type: string }
        eligibilityVersion: { type: integer, minimum: 0 }
        signalsVersion: { type: integer, minimum: 0 }
        status: { type: string }
        lease:
          type: [object, 'null']
          additionalProperties: false
          required: [leaseId, expiresAt]
          properties:
            leaseId: { type: string }
            expiresAt: { type: string, format: date-time }
    EligibleProfileSnapshotItemsResponse:
      type: object
      additionalProperties: false
      required: [items, cursor]
      properties:
        snapshot: { $ref: '#/components/schemas/EligibleProfileSnapshot' }
        items: { type: array, items: { $ref: '#/components/schemas/EligibleProfileSnapshotItem' } }
        cursor: { $ref: '#/components/schemas/CursorPage' }
    ProfileEligibilityResponse:
      type: object
      additionalProperties: true
      required: [accountId, profileId, purpose, eligible, reasons, policy, checkedAt]
      properties:
        accountId: { type: string }
        profileId: { type: string }
        purpose: { type: string }
        eligible: { type: boolean }
        eligibilityVersion: { type: integer, minimum: 0 }
        reasons: { type: array, items: { type: string } }
        policy: { $ref: '#/components/schemas/Metadata' }
        checkedAt: { type: string, format: date-time }
    RecommendationSignalBundleResponse:
      type: object
      additionalProperties: true
      required: [accountId, profileId, eligibility, bundle]
      properties:
        accountId: { type: string }
        profileId: { type: string }
        purpose: { type: string }
        eligibility:
          type: object
          additionalProperties: true
          required: [eligible]
          properties:
            eligible: { type: boolean }
            eligibilityVersion: { type: integer, minimum: 0 }
            reason: { type: string }
        bundle:
          type: object
          additionalProperties: true
          required: [profileContext]
          properties:
            signalsVersion: { type: integer, minimum: 0 }
            generatedAt: { type: string, format: date-time }
            profileContext: { $ref: '#/components/schemas/Metadata' }
            history: { type: array, items: { $ref: '#/components/schemas/Metadata' } }
            watchHistory: { type: array, items: { $ref: '#/components/schemas/Metadata' } }
            ratings: { type: array, items: { $ref: '#/components/schemas/Metadata' } }
            watchlist: { type: array, items: { $ref: '#/components/schemas/Metadata' } }
            continueWatching: { type: array, items: { $ref: '#/components/schemas/Metadata' } }
        limits:
          type: object
          additionalProperties: true
          properties:
            historyLimitApplied: { type: integer, minimum: 0 }
            ratingsLimitApplied: { type: integer, minimum: 0 }
            watchlistLimitApplied: { type: integer, minimum: 0 }
            continueLimitApplied: { type: integer, minimum: 0 }
    RecommendationServiceListsResponse:
      type: object
      additionalProperties: false
      required: [appId, source, lists]
      properties:
        appId: { type: string }
        source: { type: string }
        lists:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [listKey, displayName, maxItems]
            properties:
              listKey: { type: string }
              displayName: { type: string }
              ownerAppId: { type: string }
              source: { type: string }
              itemType: { type: string }
              maxItems: { type: integer, minimum: 1 }
              writeMode: { type: string }
              requiresEligibilityAtWrite: { type: boolean }
    RecommendationListUpsertRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/RecommendationListWriteItem'
    RecommendationListWriteItem:
      type: object
      additionalProperties: false
      required: [type, tmdbId]
      properties:
        type:
          type: string
          enum: [movie, tv]
        tmdbId:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      not:
        anyOf:
          - required: [contentId]
          - required: [mediaKey]
          - required: [rank]
          - required: [score]
          - required: [reason]
          - required: [reasonCodes]
          - required: [metadata]
          - required: [media]
          - required: [payload]
          - required: [provider]
          - required: [providerItemId]
    RecommendationListUpsertResponse:
      type: object
      additionalProperties: false
      required: [accountId, profileId, listKey, source, version, status, itemCount, idempotency, createdAt, eligibility]
      properties:
        accountId: { type: string, readOnly: true }
        profileId: { type: string, readOnly: true }
        listKey: { type: string, readOnly: true }
        source: { type: string, readOnly: true }
        version: { type: integer, minimum: 1, readOnly: true }
        status: { type: string, enum: [written, cleared, idempotent_replay], readOnly: true }
        itemCount: { type: integer, minimum: 0, readOnly: true }
        idempotency:
          type: object
          additionalProperties: false
          required: [key, replayed]
          properties:
            key: { type: string, readOnly: true }
            replayed: { type: boolean, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        eligibility:
          type: object
          additionalProperties: false
          required: [checkedAt, eligible, eligibilityVersion]
          properties:
            checkedAt: { type: string, format: date-time, readOnly: true }
            eligible: { type: boolean, readOnly: true }
            eligibilityVersion: { type: integer, minimum: 0, readOnly: true }
    RecommendationBatchUpsertRequest:
      type: object
      additionalProperties: false
      required: [profiles]
      properties:
        profiles:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [accountId, profileId, lists]
            properties:
              accountId: { type: string }
              profileId: { type: string }
              lists:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [listKey, items]
                  properties:
                    listKey: { type: string }
                    items:
                      type: array
                      items: { $ref: '#/components/schemas/RecommendationListWriteItem' }
    RecommendationBatchUpsertResponse:
      type: object
      additionalProperties: true
      required: [status, summary, results]
      properties:
        status: { type: string }
        summary: { $ref: '#/components/schemas/Metadata' }
        results: { type: array, items: { $ref: '#/components/schemas/Metadata' } }
        requestHash: { type: string }
        idempotency: { $ref: '#/components/schemas/Metadata' }
    RecommendationRun:
      type: object
      additionalProperties: true
