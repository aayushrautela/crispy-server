openapi: 3.1.0
info:
  title: Crispy Internal Recommender API
  version: 1.0.0
  summary: RECO-owned contract for inbound event ingestion from MAIN.
  description: |
    This contract covers endpoints owned by the external recommendation engine
    (RECO). It is the consumer-side contract for the MAIN-to-RECO event ingestion
    path. MAIN-owned internal endpoints consumed by RECO are documented in
    `internal-services.v1.yaml`.

    For a description of the contract-ownership boundary between MAIN
    and RECO, see `docs/architecture/recommendation-engine.md`.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
x-api-class: internal-recommender
x-owner: crispy-recommendation-engine
x-stability: stable
servers:
  - url: https://reco.crispy.example
    description: RECO service origin placeholder
security:
  - RecommenderServiceBearer: []
tags:
  - name: Recommender Event Ingestion
    description: RECO-owned event ingestion endpoint called by MAIN outbox dispatcher.
paths:
  /internal/recommender/v1/events:
    post:
      tags: [Recommender Event Ingestion]
      operationId: ingestRecommenderEvent
      summary: Ingest a MAIN service-outbox event
      description: |
        RECO-owned inbound endpoint called by MAIN's service-outbox dispatcher.
        MAIN dispatches `service_outbox_events` rows here, including
        `recommendation.recompute_requested` envelopes with reason `admin_requested`
        for admin-triggered recompute requests.

        A duplicate event response (`409 Conflict`) is treated by MAIN's dispatcher as
        idempotent success and the service-outbox row may be marked dispatched. `2xx`
        responses are success. `400`, `401`, and `403` are permanent dispatch failures.
        `5xx` and network/timeout failures are retried by MAIN according to outbox
        retry policy.

        The current MVP response acknowledges the event and may return a recommender
        event id only. It does not return a generation job id, generation status, or
        progress to MAIN.
      x-internal: true
      x-owner: crispy-recommendation-engine
      x-consumers: [crispy-server-main]
      parameters:
        - $ref: '#/components/parameters/RecommenderInboundAuthorization'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommenderEventEnvelope' }
      responses:
        '202':
          description: Event accepted for recommender-side processing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommenderEventAcceptedResponse' }
        '200':
          description: Event accepted or already processed idempotently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommenderEventAcceptedResponse' }
        '400':
          description: Invalid event envelope; permanent failure for MAIN dispatcher.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalErrorEnvelope' }
        '401':
          description: Missing or invalid bearer token; permanent failure until configuration is fixed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalErrorEnvelope' }
        '403':
          description: Authenticated caller is not allowed to ingest events; permanent failure until configuration is fixed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalErrorEnvelope' }
        '409':
          description: Duplicate event receipt. MAIN treats this as idempotent success for dispatch state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommenderEventAcceptedResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
components:
  securitySchemes:
    RecommenderServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: service-token
      description: Raw service token whose SHA-256 hash matches CRISPY_RECOMMENDER_API_TOKEN_HASH.
  parameters:
    RecommenderInboundAuthorization:
      name: Authorization
      in: header
      required: true
      description: Bearer token from MAIN service-outbox dispatcher. RECO validates by comparing SHA-256 hash against MAIN_TO_RECOMMENDER_SERVICE_TOKEN_HASH.
      schema: { type: string, pattern: '^Bearer .+$' }
      example: Bearer <main-service-token>
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
      example: req_example_01HXRECO
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
      example: corr_example_generation_001
  responses:
    InternalServerError:
      description: Unexpected provider failure.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CanonicalErrorEnvelope' }
  schemas:
    RecommenderEventType:
      type: string
      enum:
        - recommendation.recompute_requested
    RecommenderEventReason:
      type: string
      description: Current runtime recompute reasons. `admin_requested` is emitted by admin recompute endpoints.
      enum:
        - watch_history_changed
        - rating_changed
        - watchlist_changed
        - playback_progress_changed
        - profile_created
        - profile_settings_changed
        - admin_requested
    RecommenderEventEnvelope:
      type: object
      additionalProperties: true
      required: [eventId, eventType, occurredAt, aggregateType, aggregateId, userId, profileId, source, correlationId, payload]
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 128
        eventType:
          $ref: '#/components/schemas/RecommenderEventType'
        eventVersion:
          type: integer
          minimum: 1
          default: 1
        occurredAt:
          type: string
          format: date-time
        aggregateType:
          type: string
          minLength: 1
          maxLength: 128
          example: profile
        aggregateId:
          type: string
          minLength: 1
          maxLength: 128
        userId:
          type: string
          minLength: 1
          maxLength: 128
        profileId:
          type: string
          minLength: 1
          maxLength: 128
        source:
          type: string
          minLength: 1
          maxLength: 128
          example: crispy-server
        correlationId:
          type: string
          minLength: 1
          maxLength: 128
        payload:
          type: object
          additionalProperties: true
          required: [accountId, profileId, reason]
          properties:
            accountId: { type: string, minLength: 1, maxLength: 128 }
            profileId: { type: string, minLength: 1, maxLength: 128 }
            reason: { $ref: '#/components/schemas/RecommenderEventReason' }
    RecommenderEventAcceptedResponse:
      type: object
      additionalProperties: true
      required: [accepted]
      properties:
        accepted:
          type: boolean
          const: true
        recommenderEventId:
          type: string
          description: RECO-side event receipt id when available. This is not a generation job id.
        duplicate:
          type: boolean
          description: True when the event was already received and the response is idempotent.
    ErrorCategory:
      type: string
      enum: [validation, authentication, authorization, not_found, conflict, idempotency, rate_limit, timeout, upstream_dependency, internal]
    ErrorCode:
      type: string
      enum:
        - AUTHENTICATION_REQUIRED
        - INVALID_SERVICE_TOKEN
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - VALIDATION_FAILED
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_CONFLICT
        - RATE_LIMITED
        - REQUEST_TIMEOUT
        - INTERNAL_SERVER_ERROR
    ErrorDetails:
      type: object
      description: Safe structured details. Must not contain an authoritative nested code, raw prompt, vendor payload, provider routing, or secrets.
      propertyNames:
        not:
          const: code
      additionalProperties: true
    CanonicalErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, category, retryable, requestId]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, minLength: 1, maxLength: 500 }
            category: { $ref: '#/components/schemas/ErrorCategory' }
            retryable: { type: boolean }
            requestId: { type: string, minLength: 1, maxLength: 128 }
            details: { $ref: '#/components/schemas/ErrorDetails' }
