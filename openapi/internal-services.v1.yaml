        '500': { $ref: '#/components/responses/InternalServerError' }
components:
  securitySchemes:
    RecommenderServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: service-token
      description: Raw service token whose SHA-256 hash matches CRISPY_RECOMMENDER_API_TOKEN_HASH.
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
      example: acct_example_reco_001
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
      example: prof_example_reco_001
    ListKey:
      name: listKey
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[a-z0-9][a-z0-9_-]*$' }
      example: because_you_watched
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
      example: snap_01HXRECO001
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
      example: run_01HXRECO001
    BatchId:
      name: batchId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
      example: batch_01HXRECO001
    Authorization:
      name: Authorization
      in: header
      required: true
      schema: { type: string, pattern: '^Bearer .+$' }
      example: Bearer <service-token>
    ServiceId:
      name: x-service-id
      in: header
      required: true
      schema: { type: string, const: crispy-recommendation-engine }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[\x20-\x7E]+$' }
      example: reco-run-example-001:because-you-watched
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
      example: req_example_01HXRECO
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
      example: corr_example_generation_001
  responses:
    ValidationError:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CanonicalErrorEnvelope' }
    UnauthorizedError:
      description: Missing or invalid service authentication.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CanonicalErrorEnvelope' }
    ForbiddenError:
      description: Service principal is not authorized for the target resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CanonicalErrorEnvelope' }
    NotFoundError:
      description: Resource was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CanonicalErrorEnvelope' }
    ConflictError:
      description: Idempotency or write conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CanonicalErrorEnvelope' }
    RateLimitedError:
      description: Request was rate limited.
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CanonicalErrorEnvelope' }
    InternalServerError:
      description: Unexpected provider failure.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CanonicalErrorEnvelope' }
  schemas:
    ErrorCategory:
      type: string
      enum: [validation, authentication, authorization, not_found, conflict, idempotency, rate_limit, timeout, upstream_dependency, internal]
    ErrorCode:
      type: string
      enum:
        - AUTHENTICATION_REQUIRED
        - INVALID_SERVICE_TOKEN
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - VALIDATION_FAILED
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_CONFLICT
        - RATE_LIMITED
        - REQUEST_TIMEOUT
        - INTERNAL_SERVER_ERROR
        - UNSUPPORTED_RECOMMENDATION_WRITE_FIELD
        - INVALID_RECOMMENDATION_LIST_KEY
        - INVALID_RECOMMENDATION_ITEM
        - DUPLICATE_RECOMMENDATION_ITEM
        - RECOMMENDATION_LIST_TOO_LARGE
        - RECOMMENDATION_PROFILE_NOT_ELIGIBLE
    ErrorDetails:
      type: object
      description: Safe structured details. Must not contain an authoritative nested code, raw prompt, vendor payload, provider routing, or secrets.
      propertyNames:
        not:
          const: code
      additionalProperties: true
    CanonicalErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, category, retryable, requestId]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, minLength: 1, maxLength: 500 }
            category: { $ref: '#/components/schemas/ErrorCategory' }
            retryable: { type: boolean }
            requestId: { type: string, minLength: 1, maxLength: 128 }
            details: { $ref: '#/components/schemas/ErrorDetails' }
    CursorPage:
      type: object
      additionalProperties: false
      required: [next, hasMore]
      properties:
        next: { type: [string, 'null'] }
        hasMore: { type: boolean }
    Metadata:
      type: object
      additionalProperties: true
    ResponsiveImageSet:
      type: object
      additionalProperties: false
      required: [small, medium, large]
      properties:
        small: { type: [string, 'null'] }
        medium: { type: [string, 'null'] }
        large: { type: [string, 'null'] }
    PublicItemId:
      type: string
      pattern: '^[0-9a-f]{32}$'
      minLength: 32
      maxLength: 32
    ClientMediaCard:
      type: object
      additionalProperties: false
      required: [itemId, mediaType, title, subtitle, overview, year, releaseDate, rating, maturityRating, genres, runtimeSeconds, images, trailerUrl, progress, parent, providerIds]
      properties:
        itemId: { $ref: '#/components/schemas/PublicItemId' }
        mediaType:
          type: string
          enum: [movie, tv, season, episode]
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        overview: { type: [string, 'null'] }
        year: { type: [integer, 'null'] }
        releaseDate: { type: [string, 'null'] }
        rating: { type: [number, 'null'] }
        maturityRating: { type: [string, 'null'] }
        genres:
          type: array
          items: { type: string }
        runtimeSeconds: { type: [number, 'null'] }
        images: { $ref: '#/components/schemas/ClientImages' }
        trailerUrl: { type: [string, 'null'] }
        progress:
          oneOf:
            - $ref: '#/components/schemas/ClientProgress'
            - type: 'null'
        parent:
          oneOf:
            - $ref: '#/components/schemas/ClientParentRef'
            - type: 'null'
        providerIds:
          oneOf:
            - $ref: '#/components/schemas/ClientProviderIds'
            - type: 'null'
    ClientImages:
      type: object
      additionalProperties: false
      required: [poster, backdrop, logo]
      properties:
        poster:
          oneOf:
            - $ref: '#/components/schemas/ResponsiveImageSet'
            - type: 'null'
        backdrop:
          oneOf:
            - $ref: '#/components/schemas/ResponsiveImageSet'
            - type: 'null'
        logo:
          oneOf:
            - $ref: '#/components/schemas/ResponsiveImageSet'
            - type: 'null'
        still:
          oneOf:
            - $ref: '#/components/schemas/ResponsiveImageSet'
            - type: 'null'
        thumb:
          oneOf:
            - $ref: '#/components/schemas/ResponsiveImageSet'
            - type: 'null'
    ClientProgress:
      type: object
      additionalProperties: false
      required: [played, playCount, positionSeconds, durationSeconds, percent, lastPlayedAt, watchlisted, userRating]
      properties:
        played: { type: boolean }
        playCount: { type: integer }
        positionSeconds: { type: number }
        durationSeconds: { type: number }
        percent: { type: [number, 'null'] }
        lastPlayedAt: { type: [string, 'null'] }
        watchlisted: { type: boolean }
        userRating: { type: [number, 'null'] }
    ClientParentRef:
      type: object
      additionalProperties: false
      properties:
        seriesItemId: { $ref: '#/components/schemas/PublicItemId' }
        seriesTitle: { type: string }
        seasonItemId: { $ref: '#/components/schemas/PublicItemId' }
        seasonNumber: { type: [integer, 'null'] }
        episodeNumber: { type: [integer, 'null'] }
    ClientProviderIds:
      type: object
      additionalProperties: false
      required: [tmdb, tvdb, imdb]
      properties:
        tmdb: { type: [string, 'null'] }
        tvdb: { type: [string, 'null'] }
        imdb: { type: [string, 'null'] }
    RecoProvider:
      type: string
      enum: [tmdb, tvdb, imdb, kitsu]
    RecoMediaType:
      type: string
      enum: [movie, tv]
    RecoHomeSectionType:
      type: string
      description: Semantic home section type written by recommendation engines.
      enum: [categoryTabs, heroCarousel, contentRail, collectionRail]
    RecoProviderRef:
      type: object
      additionalProperties: false
      required: [provider, providerId]
      properties:
        provider: { $ref: '#/components/schemas/RecoProvider' }
        providerId: { type: string, minLength: 1 }
    ProviderIds:
      type: object
      additionalProperties: false
      required: [Tmdb, Imdb, Tvdb]
      properties:
        Tmdb: { type: [string, 'null'] }
        Imdb: { type: [string, 'null'] }
        Tvdb: { type: [string, 'null'] }
    BaseItemImageTags:
      type: object
      additionalProperties: false
      required: [Primary, Backdrop, Logo, Thumb, Screenshot]
      properties:
        Primary:
          oneOf:
            - $ref: '#/components/schemas/ResponsiveImageSet'
            - type: 'null'
        Backdrop:
          type: array
          items: { $ref: '#/components/schemas/ResponsiveImageSet' }
        Logo:
          oneOf:
            - $ref: '#/components/schemas/ResponsiveImageSet'
            - type: 'null'
        Thumb:
          oneOf:
            - $ref: '#/components/schemas/ResponsiveImageSet'
            - type: 'null'
        Screenshot:
          type: array
          items: { $ref: '#/components/schemas/ResponsiveImageSet' }
    ParentBaseItemImageTags:
      type: object
      additionalProperties: false
      required: [Primary, Backdrop, Logo, Thumb]
      properties:
        Primary:
          oneOf:
            - $ref: '#/components/schemas/ResponsiveImageSet'
            - type: 'null'
        Backdrop:
          type: array
          items: { $ref: '#/components/schemas/ResponsiveImageSet' }
        Logo:
          oneOf:
            - $ref: '#/components/schemas/ResponsiveImageSet'
            - type: 'null'
        Thumb:
          oneOf:
            - $ref: '#/components/schemas/ResponsiveImageSet'
            - type: 'null'
    RemoteTrailer:
      type: object
      additionalProperties: false
      required: [Name, Url, ThumbnailUrl]
      properties:
        Name: { type: [string, 'null'] }
        Url: { type: string }
        ThumbnailUrl: { type: [string, 'null'] }
    UserItemData:
      type: object
      additionalProperties: false
      required: [ItemId, IsFavorite, Played, PlayCount, PlaybackPositionTicks, RuntimeTicks, PlayedPercentage, LastPlayedDate, Rating, DismissedFromContinueWatching]
      properties:
        ItemId: { type: [string, 'null'], pattern: '^[0-9a-f]{32}$' }
        IsFavorite: { type: boolean }
        Played: { type: boolean }
        PlayCount: { type: number }
        PlaybackPositionTicks: { type: [number, 'null'] }
        RuntimeTicks: { type: [number, 'null'] }
        PlayedPercentage: { type: [number, 'null'] }
        LastPlayedDate: { type: [string, 'null'] }
        Rating: { type: [number, 'null'] }
        DismissedFromContinueWatching: { type: boolean }
    BaseItemDto:
      type: object
      additionalProperties: false
      required: [Id, Type, Name, OriginalTitle, Overview, Taglines, ProductionYear, PremiereDate, CommunityRating, OfficialRating, Certification, Genres, RunTimeTicks, Status, ProviderIds, ImageTags, ParentImageTags, SeriesId, SeriesName, SeasonId, SeasonName, ParentIndexNumber, IndexNumber, AbsoluteIndexNumber, EpisodeTitle, AirDate, RemoteTrailers, PosterColor, BackdropColor, UserData]
      properties:
        Id: { type: string, pattern: '^[0-9a-f]{32}$', minLength: 32, maxLength: 32 }
        Type: { type: string, enum: [Movie, Series, Season, Episode, Unknown] }
        Name: { type: string }
        OriginalTitle: { type: [string, 'null'] }
        Overview: { type: [string, 'null'] }
        Taglines: { type: array, items: { type: string } }
        ProductionYear: { type: [integer, 'null'] }
        PremiereDate: { type: [string, 'null'] }
        CommunityRating: { type: [number, 'null'] }
        OfficialRating: { type: [string, 'null'] }
        Certification: { type: [string, 'null'] }
        Genres: { type: array, items: { type: string } }
        RunTimeTicks: { type: [integer, 'null'] }
        Status: { type: [string, 'null'] }
        ProviderIds: { $ref: '#/components/schemas/ProviderIds' }
        ImageTags: { $ref: '#/components/schemas/BaseItemImageTags' }
        ParentImageTags:
          oneOf:
            - $ref: '#/components/schemas/ParentBaseItemImageTags'
            - type: 'null'
        SeriesId: { type: [string, 'null'], pattern: '^[0-9a-f]{32}$' }
        SeriesName: { type: [string, 'null'] }
        SeasonId: { type: [string, 'null'], pattern: '^[0-9a-f]{32}$' }
        SeasonName: { type: [string, 'null'] }
        ParentIndexNumber: { type: [integer, 'null'] }
        IndexNumber: { type: [integer, 'null'] }
        AbsoluteIndexNumber: { type: [integer, 'null'] }
        EpisodeTitle: { type: [string, 'null'] }
        AirDate: { type: [string, 'null'] }
        RemoteTrailers:
          type: array
          items: { $ref: '#/components/schemas/RemoteTrailer' }
        PosterColor: { type: [string, 'null'] }
        BackdropColor: { type: [string, 'null'] }
        UserData:
          oneOf:
            - $ref: '#/components/schemas/UserItemData'
            - type: 'null'
    AppSelfResponse:
      type: object
      additionalProperties: false
      required: [appId, name, status, principalType, scopes, ownedSources, rateLimitPolicy]
      properties:
        appId: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string }
        principalType: { type: string }
        scopes: { type: array, items: { type: string } }
        ownedSources: { type: array, items: { type: string } }
        rateLimitPolicy:
          type: object
          additionalProperties: false
          required: [profileChangesReadsPerMinute, profileSignalReadsPerMinute, recommendationWritesPerMinute, batchWritesPerMinute, configBundleReadsPerMinute, runsPerHour, snapshotsPerDay, maxProfilesPerBatch, maxItemsPerList]
          properties:
            profileChangesReadsPerMinute: { type: number }
            profileSignalReadsPerMinute: { type: number }
            recommendationWritesPerMinute: { type: number }
            batchWritesPerMinute: { type: number }
            configBundleReadsPerMinute: { type: number }
            runsPerHour: { type: number }
            snapshotsPerDay: { type: number }
            maxProfilesPerBatch: { type: number }
            maxItemsPerList: { type: number }
    EligibleProfileChange:
      type: object
      additionalProperties: true
      required: [changeId, accountId, profileId, eventType, eligible, changedAt]
      properties:
        changeId: { type: string }
        accountId: { type: string }
        profileId: { type: string }
        eventType: { type: string }
        eligible: { type: boolean }
        eligibilityVersion: { type: integer, minimum: 0 }
        signalsVersion: { type: integer, minimum: 0 }
        changedAt: { type: string, format: date-time }
        reasons: { type: array, items: { type: string } }
        recommendedActions: { type: array, items: { type: string } }
    EligibleProfileChangesResponse:
      type: object
      additionalProperties: false
      required: [items, cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/EligibleProfileChange' } }
        cursor: { $ref: '#/components/schemas/CursorPage' }
    EligibleProfileSnapshotCreateRequest:
      type: object
      additionalProperties: true
      required: [purpose]
