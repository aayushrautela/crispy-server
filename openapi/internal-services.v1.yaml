        reasons: { type: array, items: { type: string } }
        policy: { $ref: '#/components/schemas/Metadata' }
        checkedAt: { type: string, format: date-time }
    ProfileReadSignalResponse:
      description: >-
        Shared per-signal read envelope. Returns the same ClientMediaCard shape
        as the public-app watch routes. Items are fully hydrated ClientMediaCard
        objects (itemId, mediaType, title, subtitle, overview, year, rating,
        maturityRating, genres, runtimeSeconds, images, trailerUrl, progress,
        parent). The internal signal routes go through the same WatchCardHydrator
        as the public watch routes, so the reco worker and reco webui read the
        same card shape the client app reads.
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [Items, StartIndex, TotalRecordCount, NextCursor, HasMore]
          properties:
            Items:
              type: array
              items: { $ref: '#/components/schemas/ClientMediaCard' }
            StartIndex:
              type: integer
              minimum: 0
            TotalRecordCount:
              type: integer
              minimum: 0
            NextCursor:
              type: [string, 'null']
            HasMore:
              type: boolean
        meta:
          type: object
          properties:
            requestId: { type: string }
    ProfileMetaReadResponse:
      description: 'Profile-scoped metadata returned by the per-signal profile-meta route. Consumed by the reco engine to assemble GenerateRequest.profileContext (profileName, isKids, language, region, watchDataOrigin).'
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [profileName, isKids, language, region, watchDataOrigin]
          properties:
            profileName: { type: string }
            isKids: { type: boolean }
            language: { type: [string, 'null'] }
            region: { type: [string, 'null'] }
            watchDataOrigin: { type: string }
        meta:
          type: object
          properties:
            requestId: { type: string }
    TasteProfileReadResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [tasteProfile]
          properties:
            tasteProfile:
              oneOf:
                - $ref: '#/components/schemas/TasteProfileRecord'
                - type: 'null'
    TasteTagConnection:
      type: object
      additionalProperties: false
      required: [to, weight]
      properties:
        to: { type: string, minLength: 1, description: "Name of the connected entity - a genre, person, or another tag" }
        weight: { type: number, description: "Connection strength derived from co-occurrence frequency in the user's watch history" }
    TasteProfileWriteRequest:
      type: object
      additionalProperties: false
      required: [sourceKey, contentTypePref, ratingTendency, watchingPace, aiSummary, source, vectors]
      properties:
        sourceKey: { type: string, minLength: 1 }
        contentTypePref: { $ref: '#/components/schemas/Metadata' }
        ratingTendency: { $ref: '#/components/schemas/Metadata' }
        watchingPace: { type: [string, 'null'] }
        aiSummary: { type: [string, 'null'] }
        source: { type: string, minLength: 1 }
        vectors: { $ref: '#/components/schemas/TasteVectors' }
    TasteProfileRecord:
      type: object
      required: [profileId, sourceKey, contentTypePref, ratingTendency, watchingPace, aiSummary, source, updatedByKind, version, createdAt, updatedAt, vectors]
      properties:
        profileId: { type: string }
        sourceKey: { type: string }
        contentTypePref: { $ref: '#/components/schemas/Metadata' }
        ratingTendency: { $ref: '#/components/schemas/Metadata' }
        watchingPace: { type: [string, 'null'] }
        aiSummary: { type: [string, 'null'] }
        source: { type: string }
        updatedByKind: { type: string }
        updatedById: { type: [string, 'null'] }
        version: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        vectors: { $ref: '#/components/schemas/TasteVectors' }
    TasteWeightedEntry:
      type: object
      additionalProperties: false
      required: [name, shortScore, shortCount, longScore, longCount]
      properties:
        name: { type: string, minLength: 1 }
        shortScore: { type: number }
        shortCount: { type: number }
        longScore: { type: number }
        longCount: { type: number }
    TastePersonEntry:
      allOf:
        - $ref: '#/components/schemas/TasteWeightedEntry'
        - type: object
          additionalProperties: false
          required: [roles]
          properties:
            roles:
              type: array
              items: { type: string, enum: [actor, director] }
    TasteTagVectorEntry:
      allOf:
        - $ref: '#/components/schemas/TasteWeightedEntry'
        - type: object
          additionalProperties: false
          properties:
            connections:
              type: array
              items: { $ref: '#/components/schemas/TasteTagConnection' }
    TasteVectors:
      type: object
      additionalProperties: false
      required: [schemaVersion, genres, tags, people, mood, decades]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        genres:
          type: array
          items: { $ref: '#/components/schemas/TasteWeightedEntry' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/TasteTagVectorEntry' }
        people:
          type: array
          items: { $ref: '#/components/schemas/TastePersonEntry' }
        mood:
          type: array
          items: { $ref: '#/components/schemas/TasteWeightedEntry' }
        decades:
          type: array
          items: { $ref: '#/components/schemas/TasteWeightedEntry' }
