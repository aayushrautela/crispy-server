openapi: 3.1.0
info:
  title: Crispy Internal Services API
  version: 1.0.0
  summary: Provider-owned contract for the internal recommendation-engine integration surface.
  description: |
    Crispy Server is the source of truth for these internal APIs. The external
    recommendation engine consumes this contract and must not rely on legacy
    fallback shapes or consumer-owned schemas.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
x-api-class: internal-service
x-owner: crispy-server
x-stability: stable
servers:
  - url: https://api.crispy.example
    description: Production API origin placeholder
security:
  - RecommenderServiceBearer: []
tags:
  - name: App Identity
    description: Service principal self-inspection and configuration.
  - name: Profile Eligibility
    description: Profile eligibility discovery and change tracking.
  - name: Signal Bundles
    description: Profile signal data for recommendation generation.
  - name: Recommendation Lists
    description: Service-owned recommendation result publication.
  - name: Recommendation Runs
    description: Recommendation generation run lifecycle management.
  - name: Audit Events
    description: Service audit event logging.
  - name: AI Plan
    description: Server-owned AI-plan generation boundary.
paths:
  /internal/apps/v1/me:
    get:
      tags: [App Identity]
      operationId: getInternalAppSelf
      summary: Return the authenticated service app principal
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Authenticated service app details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppSelfResponse' }
              examples:
                success:
                  externalValue: ./examples/auth-me/response.success.json
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/profiles/eligible/changes:
    get:
      tags: [Profile Eligibility]
      operationId: listInternalEligibleProfileChanges
      summary: List eligible profile changes using canonical cursor pagination
      description: Uses provider-owned query names only; no legacy since alias is accepted by this contract.
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 4096 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: reason
          in: query
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: accountId
          in: query
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: profileId
          in: query
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: A page of eligible profile changes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EligibleProfileChangesResponse' }
              examples:
                page:
                  externalValue: ./examples/eligible-changes/response.page.json
                empty:
                  externalValue: ./examples/eligible-changes/response.empty.json
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '429': { $ref: '#/components/responses/RateLimitedError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/profiles/eligible/snapshots:
    post:
      tags: [Profile Eligibility]
      operationId: createInternalEligibleProfileSnapshot
      summary: Create an eligible profile snapshot
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EligibleProfileSnapshotCreateRequest' }
            examples:
              valid:
                externalValue: ./examples/eligible-snapshots/request.valid.json
      responses:
        '201':
          description: Snapshot created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EligibleProfileSnapshotResponse' }
              examples:
                created:
                  externalValue: ./examples/eligible-snapshots/response.created.json
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '429': { $ref: '#/components/responses/RateLimitedError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/profiles/eligible/snapshots/{snapshotId}/items:
    get:
      tags: [Profile Eligibility]
      operationId: listInternalEligibleProfileSnapshotItems
      summary: List eligible profile snapshot items with nested cursor
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 4096 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: leaseSeconds
          in: query
          description: Optional lease duration for returned snapshot items.
          schema: { type: integer, minimum: 1, maximum: 3600 }
      responses:
        '200':
          description: A page of snapshot items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EligibleProfileSnapshotItemsResponse' }
              examples:
                page:
                  externalValue: ./examples/eligible-snapshots/items.response.page.json
                empty:
                  externalValue: ./examples/eligible-snapshots/items.response.empty.json
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '429': { $ref: '#/components/responses/RateLimitedError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/accounts/{accountId}/profiles/{profileId}/eligibility:
    get:
      tags: [Profile Eligibility]
      operationId: getInternalProfileEligibility
      summary: Return current recommendation eligibility for a profile
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Eligibility decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileEligibilityResponse' }
              examples:
                eligible:
                  externalValue: ./examples/profile-eligibility/response.eligible.json
                ineligible:
                  externalValue: ./examples/profile-eligibility/response.ineligible.json
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/accounts/{accountId}/profiles/{profileId}/signals/watch/history:
    get:
      tags: [Profile Signals]
      operationId: getInternalProfileWatchHistory
      summary: Read a profile's watch history (reco service-readable, shared shape with public)
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Watch history page (ClientMediaCard query result envelope, shared with public app).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileReadSignalResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '429': { $ref: '#/components/responses/RateLimitedError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/accounts/{accountId}/profiles/{profileId}/signals/watch/ratings:
    get:
      tags: [Profile Signals]
      operationId: getInternalProfileWatchRatings
      summary: Read a profile's ratings (reco service-readable, shared shape with public)
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Ratings page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileReadSignalResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '429': { $ref: '#/components/responses/RateLimitedError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/accounts/{accountId}/profiles/{profileId}/signals/watch/watchlist:
    get:
      tags: [Profile Signals]
      operationId: getInternalProfileWatchlist
      summary: Read a profile's watchlist (reco service-readable, shared shape with public)
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Watchlist page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileReadSignalResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '429': { $ref: '#/components/responses/RateLimitedError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/accounts/{accountId}/profiles/{profileId}/signals/watch/continue-watching:
    get:
      tags: [Profile Signals]
      operationId: getInternalProfileContinueWatching
      summary: Read a profile's continue-watching (reco service-readable, shared shape with public)
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Continue-watching page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileReadSignalResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '429': { $ref: '#/components/responses/RateLimitedError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/accounts/{accountId}/profiles/{profileId}/signals/watch/episodic-follow:
    get:
      tags: [Profile Signals]
      operationId: getInternalProfileEpisodicFollow
      summary: Read a profile's tracked series (reco service-readable, shared shape with public)
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Tracked-series page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileReadSignalResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '429': { $ref: '#/components/responses/RateLimitedError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/accounts/{accountId}/profiles/{profileId}/signals/profile-meta:
    get:
      tags: [Profile Signals]
      operationId: getInternalProfileMeta
      summary: Read profile-scoped metadata (profileName, isKids, language, region) for reco GenerateRequest.profileContext
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Profile metadata for reco.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileMetaReadResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '429': { $ref: '#/components/responses/RateLimitedError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/accounts/{accountId}/profiles/{profileId}/signals/taste:
    get:
      tags: [Profile Signals]
      operationId: getInternalProfileTasteProfile
      summary: Read a profile's stored taste profile (reco service-readable)
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: sourceKey
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Stored taste profile for the profile (or null when not yet present).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TasteProfileReadResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '429': { $ref: '#/components/responses/RateLimitedError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [Profile Signals]
      operationId: putInternalProfileTasteProfile
      summary: Push an updated taste profile back for a profile (reco pushes taste)
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TasteProfileWriteRequest' }
      responses:
        '200':
          description: Stored taste profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TasteProfileReadResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '429': { $ref: '#/components/responses/RateLimitedError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/accounts/{accountId}/profiles/{profileId}/recommendations/lists/{listKey}:
    put:
      tags: [Recommendation Lists]
      operationId: upsertInternalRecommendationList
      summary: Upsert a service-owned recommendation list
      description: |
        Publishes an ordered home list for a profile. The write endpoint is the source
        of truth for authorization, list-key/section-type compatibility, item limits,
        eligibility, idempotency, and storage. Official recommender writes may use only
        category-tabs/categoryTabs (max 100), hero-carousel/heroCarousel (max 10),
        content-rails/contentRail (max 100), and collection-rails/collectionRail (max 100).
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/ListKey'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationListUpsertRequest'
            examples:
              valid:
                externalValue: ./examples/recommendation-list-upsert/request.valid.json
      responses:
        '201':
          description: A new recommendation-list version was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationListUpsertResponse'
        '200':
          description: An idempotent replay returned the previously written result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationListUpsertResponse'
        '400':
          description: Invalid write DTO, including server-derived fields such as items[].contentId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalErrorEnvelope'
              examples:
                unsupportedField:
                  externalValue: ./examples/recommendation-list-upsert/error.unsupported-field.json
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitedError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/recommendations/batch-upsert:
    post:
      tags: [Recommendation Lists]
      operationId: batchUpsertInternalRecommendations
      summary: Batch upsert recommendation lists for multiple profiles
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationBatchUpsertRequest' }
            examples:
              valid:
                externalValue: ./examples/batch-upsert/request.valid.json
      responses:
        '200':
          description: Batch upsert completed or partially failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationBatchUpsertResponse' }
              examples:
                success:
                  externalValue: ./examples/batch-upsert/response.success.json
                partialFailure:
                  externalValue: ./examples/batch-upsert/response.partial-failure.json
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitedError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/recommendations/runs:
    post:
      tags: [Recommendation Runs]
      operationId: createInternalRecommendationRun
      summary: Create a recommendation generation run
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationRunCreateRequest' }
            examples:
              valid:
                externalValue: ./examples/recommendation-runs/create.request.json
      responses:
        '201':
          description: Run created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationRunResponse' }
              examples:
                created:
                  externalValue: ./examples/recommendation-runs/create.response.json
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '429': { $ref: '#/components/responses/RateLimitedError' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/apps/v1/recommendations/runs/{runId}:
    patch:
      tags: [Recommendation Runs]
      operationId: updateInternalRecommendationRun
      summary: Update a recommendation generation run
      description: Returns 200 with a run envelope; consumers may ignore the body.
      x-internal: true
      x-owner: crispy-server
      x-consumers: [crispy-recommendation-engine]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationRunPatchRequest' }
            examples:
              running:
                externalValue: ./examples/recommendation-runs/patch.request.running.json
              completed:
                externalValue: ./examples/recommendation-runs/patch.request.completed.json
      responses:
        '200':
          description: Run updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationRunResponse' }
              examples:
                updated:
                  externalValue: ./examples/recommendation-runs/update.response.json
