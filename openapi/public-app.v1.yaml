openapi: 3.1.0
info:
  title: Crispy Public App API
  version: 1.0.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
x-api-class: public-app
x-owner: crispy-server
x-stability: stable
servers:
  - url: https://api.crispy.example
    description: Production API origin placeholder
security:
  - UserBearerAuth: []
tags:
  - name: Identity
    description: Authenticated user identity.
  - name: Account
    description: Account settings and lifecycle.
  - name: Account Secrets
    description: User-owned secret status and writes.
  - name: Profiles
    description: Profile management.
  - name: Imports
    description: Watch-data import flows.
  - name: Watch
    description: Watch state, history, watchlist, and ratings.
  - name: Metadata
    description: Metadata lookup/search/playback.
  - name: Calendar
    description: Profile calendar.
  - name: AI
    description: User-facing AI features.
  - name: Tokens
    description: Personal access token management.
  - name: Recommendations
    description: Taste profile and recommendation outputs.
paths:
  /v1/account:
    delete:
      tags:
        - Account
      operationId: deleteV1Account
      summary: Delete the authenticated account.
      security:
        - UserBearerAuth: []
      responses:
        "204":
          description: Resource deleted or cleared.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/account/secrets/mdblist-api-key:
    get:
      tags:
        - Account Secrets
      operationId: getV1AccountSecretsMdblistApiKey
      summary: Return MDBList API key secret status.
      security:
        - UserBearerAuth: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags:
        - Account Secrets
      operationId: putV1AccountSecretsMdblistApiKey
      summary: Store MDBList API key secret.
      security:
        - UserBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags:
        - Account Secrets
      operationId: deleteV1AccountSecretsMdblistApiKey
      summary: Delete MDBList API key secret.
      security:
        - UserBearerAuth: []
      responses:
        "204":
          description: Resource deleted or cleared.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/account/settings:
    get:
      tags:
        - Account
      operationId: getV1AccountSettings
      summary: Return account settings.
      security:
        - UserBearerAuth: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      tags:
        - Account
      operationId: patchV1AccountSettings
      summary: Update account settings.
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/account/addons:
    get:
      tags:
        - Account
      operationId: getV1AccountAddons
      summary: List installed addons.
      security:
        - UserBearerAuth: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Account
      operationId: postV1AccountAddons
      summary: Install addon.
      description: >
        Installs a new addon by manifest URL. Only the admin profile can
        install addons. Duplicate manifest URLs are rejected with 409.
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "201":
          description: Addon installed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/account/addons/{addonId}:
    delete:
      tags:
        - Account
      operationId: deleteV1AccountAddonsAddonId
      summary: Remove addon.
      description: >
        Removes an installed addon by ID. Only the admin profile can remove
        addons.
      security:
        - UserBearerAuth: []
      parameters:
        - name: addonId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "204":
          description: Resource deleted or cleared.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/auth/personal-access-tokens:
    get:
      tags:
        - Tokens
      operationId: getV1AuthPersonalAccessTokens
      summary: List personal access tokens.
      security:
        - UserBearerAuth: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Tokens
      operationId: postV1AuthPersonalAccessTokens
      summary: Create personal access token.
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "201":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/auth/personal-access-tokens/{tokenId}:
    delete:
      tags:
        - Tokens
      operationId: deleteV1AuthPersonalAccessTokensTokenId
      summary: Delete personal access token.
      security:
        - UserBearerAuth: []
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "204":
          description: Resource deleted or cleared.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/imports/{provider}/callback:
    get:
      tags:
        - Imports
      operationId: getV1ImportsProviderCallback
      summary: Complete OAuth import callback.
      security:
        - UserBearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/me:
    get:
      tags:
        - Identity
      operationId: getV1Me
      summary: Return current authenticated user.
      security:
        - UserBearerAuth: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/account/bootstrap:
    post:
      tags:
        - Identity
      operationId: postV1AccountBootstrap
      summary: Create the account's primary profile during onboarding.
      description: >
        Idempotently creates the account's first (primary) profile. The profile
        name is required, and the resulting profile is always the account admin
        and is never a kids profile. A retried call returns the existing primary
        profile instead of creating a duplicate.
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/metadata/people/{personId}:
    get:
      tags:
        - Metadata
      operationId: getV1MetadataPeoplePersonId
      summary: Get person details.
      description: |
        Returns a person profile with `knownFor` — the titles the person is most known for,
        ordered by popularity. Each entry uses the standardized ClientMediaCard shape shared
        by all title rails (e.g. "More Like This" on the item extras endpoint), so clients can
        render both with one card component and navigate using `itemId` directly.
      security:
        - UserBearerAuth: []
      parameters:
        - name: personId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/PublicItemId"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataPersonDetailResponseEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/metadata/items/{itemId}:
    get:
      tags:
        - Metadata
      operationId: getV1MetadataItemsItemId
      summary: Get item details (without extras).
      description: |
        Returns core metadata for a movie or show. Extras (seasons, reviews, similar titles, collection parts) are available via `/v1/metadata/items/{itemId}/extras`; episodes are served by `/v1/metadata/shows/{itemId}/episodes`.
        Item IDs are dashless lowercase UUID hex strings.
        Key video fields:
        - `videos` — all TMDB video results for the title.
        - `RemoteTrailers` — primary trailer entries with `Url` and `ThumbnailUrl` on Jellyfin-style item payloads.
      security:
        - UserBearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/PublicItemId"
        - name: language
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/metadata/items/{itemId}/extras:
    get:
      tags:
        - Metadata
      operationId: getV1MetadataItemsItemIdExtras
      summary: Get optional item detail sections (seasons, reviews, similar, collection parts).
      security:
        - UserBearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/PublicItemId"
        - name: language
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/metadata/shows/{itemId}/episodes:
    get:
      tags:
        - Metadata
      operationId: getV1MetadataShowsItemIdEpisodes
      summary: Get episodes for a series (Jellyfin-style /Shows/{id}/Episodes parity).
      description: |
        Returns every episode for a series as a list of standardized ClientMediaCard entries.
        The series is resolved from the item id (a show, season, or episode id is accepted
        and mapped to its parent series). Each episode carries its own canonical `itemId`
        plus `parent.seriesItemId`, `parent.seasonItemId`, `parent.seasonNumber`
        (season) and `parent.episodeNumber` (episode). Pass `season` to scope the response
        to a single season. Item IDs are dashless lowercase UUID hex strings.
      security:
        - UserBearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/PublicItemId"
        - name: language
          in: query
          required: false
          schema:
            type: string
        - name: season
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/playback/resolve:
    get:
      tags:
        - Metadata
      operationId: getV1PlaybackResolve
      summary: Resolve playback metadata.
      security:
        - UserBearerAuth: []
      parameters:
        - name: itemId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PublicItemId"
        - name: language
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/profiles:
    get:
      tags:
        - Profiles
      operationId: getV1Profiles
      summary: List profiles.
      security:
        - UserBearerAuth: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Profiles
      operationId: postV1Profiles
      summary: Create profile.
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "201":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/profiles/{profileId}:
    patch:
      tags:
        - Profiles
      operationId: patchV1ProfilesProfileId
      summary: Update profile.
      security:
        - UserBearerAuth: []
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/profiles/{profileId}/pin:
    post:
      tags:
        - Profiles
      operationId: postV1ProfilesProfileIdPin
      summary: Set profile PIN.
      security:
        - UserBearerAuth: []
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePinSetRequest"
