  /v1/profiles/{profileId}/watch/history/{id}:
    delete:
      tags:
        - Watch
      operationId: deleteV1ProfilesProfileIdWatchHistoryId
      summary: Remove item from watch history.
      description: >
        Permanently removes an item from the profile's watch history. Progress is
        intentionally discarded. For a season or show, the removal cascades to every
        child episode (and season) so they no longer appear in history. A specific
        episode within a show can be targeted with `seasonNumber` and `episodeNumber`.
        Idempotent — removing an absent entry is a no-op.
      security:
        - UserBearerAuth: []
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/PublicItemId"
        - name: seasonNumber
          in: query
          required: false
          schema:
            type: number
            nullable: true
        - name: episodeNumber
          in: query
          required: false
          schema:
            type: number
            nullable: true
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchActionResponseEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
