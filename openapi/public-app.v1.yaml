  /v1/metadata/titles/{mediaKey}:
    get:
      tags:
        - Metadata
      operationId: getV1MetadataTitlesMediaKey
      summary: Get title details.
      description: |
        Returns full metadata for a movie or show. Key video fields:
        - `videos` — all TMDB video results for the title.
        - `trailerUrl` / `trailerThumbnailUrl` — primary trailer (official YouTube trailer preferred; prefers requested/preferred language, then English, then original language, then any language).
        - `extraVideos` — Behind the Scenes and Bloopers videos for client apps to use separately.
      security:
        - UserBearerAuth: []
      parameters:
        - name: mediaKey
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: Successful response.
          content:
