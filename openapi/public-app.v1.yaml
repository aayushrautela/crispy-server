        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  securitySchemes:
    UserBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: user-session-or-jwt
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 256
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Authenticated actor is not authorized.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Write conflict or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnprocessableEntity:
      description: Request semantics are valid but the content is unprocessable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ProfileLocked:
      description: Profile is locked and requires a PIN.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: true
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: true
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
    GenericObject:
      type: object
      additionalProperties: true
    AiInsightStandoutTag:
      type: string
      enum:
        - PERFORMANCE
        - VISUALS
        - STORY
        - DIRECTION
        - WORLD_BUILDING
    AiInsightSlide:
      type: object
      additionalProperties: false
      required: [key, label, kind, body, tag, focus, context, backdrop, accent]
      properties:
        key:
          type: string
          enum:
            - the_good_stuff
            - the_catch
            - standout_element
            - trivia
        label:
          type: string
          minLength: 1
        kind:
          type: string
          enum: [prose, standout, trivia]
        body:
          nullable: true
          type: string
        tag:
          anyOf:
            - $ref: "#/components/schemas/AiInsightStandoutTag"
            - type: "null"
        focus:
          nullable: true
          type: string
        context:
          nullable: true
          type: string
        backdrop:
          $ref: "#/components/schemas/ResponsiveImageSet"
        accent:
          type: string
          minLength: 1
    AiInsightsResponse:
      type: object
      additionalProperties: false
      required: [slides]
      properties:
        slides:
          type: array
          items:
            $ref: "#/components/schemas/AiInsightSlide"
    WatchActionResponse:
      type: object
      additionalProperties: false
      required: [accepted, mode]
      properties:
        accepted:
          type: boolean
        mode:
          type: string
          enum: [synchronous]
        reason:
          type: string
          description: >-
            Human-readable explanation of why the mutation was rejected. Present
            only when `accepted` is false, so clients can surface the
            server-provided message instead of a hardcoded fallback.
    WatchActionResponseEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/WatchActionResponse"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ProfilePinSetRequest:
      type: object
      additionalProperties: false
      required: [pin]
      properties:
        pin:
          type: string
          pattern: '^\d{4}$'
          description: A 4-digit PIN.
    ProfilePinChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPin, newPin]
      properties:
        currentPin:
          type: string
          pattern: '^\d{4}$'
        newPin:
          type: string
          pattern: '^\d{4}$'
    ProfilePinRemoveRequest:
      type: object
      additionalProperties: false
      required: [currentPin]
      properties:
        currentPin:
          type: string
          pattern: '^\d{4}$'
    ProfilePinVerifyRequest:
      type: object
      additionalProperties: false
      required: [pin]
      properties:
