components:
  securitySchemes:
    UserBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: user-session-or-jwt
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 256
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Authenticated actor is not authorized.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Write conflict or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: true
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: true
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
    GenericObject:
      type: object
      additionalProperties: true
    WatchActionResponse:
      type: object
      additionalProperties: false
      required: [accepted, mode]
      properties:
        accepted:
          type: boolean
        mode:
          type: string
          enum: [synchronous]
    WatchActionResponseEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/WatchActionResponse"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ProfilePinSetRequest:
      type: object
      additionalProperties: false
      required: [pin]
      properties:
        pin:
          type: string
          pattern: '^\d{4}$'
          description: A 4-digit PIN.
    ProfilePinChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPin, newPin]
      properties:
        currentPin:
          type: string
          pattern: '^\d{4}$'
        newPin:
          type: string
          pattern: '^\d{4}$'
    ProfilePinRemoveRequest:
      type: object
      additionalProperties: false
      required: [currentPin]
      properties:
        currentPin:
          type: string
          pattern: '^\d{4}$'
    ProfilePinVerifyRequest:
      type: object
      additionalProperties: false
      required: [pin]
      properties:
        pin:
          type: string
          pattern: '^\d{4}$'
    AdminPolicyUpdateRequest:
      type: object
      additionalProperties: false
      required: [requirePinToAddProfiles]
      properties:
        requirePinToAddProfiles:
          type: boolean
    ResponsiveImageSet:
      type: object
      additionalProperties: false
      required: [small, medium, large]
      properties:
        small:
          anyOf:
            - type: string
            - type: "null"
        medium:
          anyOf:
            - type: string
            - type: "null"
        large:
          anyOf:
            - type: string
            - type: "null"
    BaseItemImageTags:
      type: object
      additionalProperties: false
      required: [Primary, Backdrop, Logo, Thumb, Screenshot]
      properties:
        Primary:
          anyOf:
            - $ref: "#/components/schemas/ResponsiveImageSet"
            - type: "null"
        Backdrop:
          type: array
          items:
            $ref: "#/components/schemas/ResponsiveImageSet"
        Logo:
          anyOf:
            - $ref: "#/components/schemas/ResponsiveImageSet"
            - type: "null"
        Thumb:
          anyOf:
            - $ref: "#/components/schemas/ResponsiveImageSet"
            - type: "null"
        Screenshot:
          type: array
          items:
            $ref: "#/components/schemas/ResponsiveImageSet"
    ParentBaseItemImageTags:
      type: object
      additionalProperties: false
      required: [Primary, Backdrop, Logo, Thumb]
      properties:
        Primary:
          anyOf:
            - $ref: "#/components/schemas/ResponsiveImageSet"
            - type: "null"
        Backdrop:
          type: array
          items:
            $ref: "#/components/schemas/ResponsiveImageSet"
        Logo:
          anyOf:
            - $ref: "#/components/schemas/ResponsiveImageSet"
            - type: "null"
        Thumb:
          anyOf:
            - $ref: "#/components/schemas/ResponsiveImageSet"
            - type: "null"
    PublicItemId:
      type: string
      pattern: ^[0-9a-f]{32}$
      minLength: 32
      maxLength: 32
    ProviderIds:
      type: object
      additionalProperties: false
      required: [Tmdb, Imdb, Tvdb]
      properties:
        Tmdb:
          anyOf:
            - type: string
            - type: "null"
        Imdb:
          anyOf:
            - type: string
            - type: "null"
        Tvdb:
          anyOf:
            - type: string
            - type: "null"
    RemoteTrailerDto:
      type: object
      additionalProperties: false
      required: [Name, Url, ThumbnailUrl]
      properties:
        Name:
          anyOf:
            - type: string
            - type: "null"
        Url:
          type: string
        ThumbnailUrl:
          anyOf:
            - type: string
            - type: "null"
    UserItemDataDto:
      type: object
      additionalProperties: false
      required: [ItemId, IsFavorite, Played, PlayCount, PlaybackPositionTicks, RuntimeTicks, PlayedPercentage, LastPlayedDate, Rating, DismissedFromContinueWatching]
      properties:
        ItemId:
