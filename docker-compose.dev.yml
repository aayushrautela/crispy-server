name: crispy-server

services:
  api:
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${SUPABASE_DB_PASSWORD}@supabase-db:5432/postgres
      REDIS_URL: redis://host.docker.internal:6379
      AUTH_BASE_URL: http://host.docker.internal:8000
      AUTH_ADMIN_API_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AUTH_JWT_AUDIENCE: authenticated
      AUTH_JWT_ISSUER: http://host.docker.internal:8000/auth/v1
    command: npm run start:api
    ports:
      - "127.0.0.1:18765:18765"
    networks:
      supabase_default: {}
      crispy-shared:
        aliases:
          - crispy-server-api
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${SUPABASE_DB_PASSWORD}@supabase-db:5432/postgres
      REDIS_URL: redis://host.docker.internal:6379
      AUTH_BASE_URL: http://host.docker.internal:8000
      AUTH_ADMIN_API_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AUTH_JWT_AUDIENCE: authenticated
      AUTH_JWT_ISSUER: http://host.docker.internal:8000/auth/v1
    command: npm run start:worker
    networks:
      - supabase_default
      - crispy-shared
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  supabase_default:
    external: true
  crispy-shared:
    external: true
    name: crispy-shared
